[package]
name = "tariro_ide_idpte"
version = "0.1.0"
edition = "2021"

[dependencies]
syntect = "0.15.0"
lazy_static = "1.4.0"
tokio = { version = "1", features = ["full"] }
axum = "0.7.5"
tower-http = { version = "0.5.2", features = ["fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.3.2"
tokio-util = { version = "0.7.10", features = ["codec"] }
futures = "0.3.30"
urlencoding = "2.1.3"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.2.1", features = ["v4"] }
log = "0.4"
simple_logger = "1.13"
lsp-types = "0.94"
lsp-server = { version = "0.7", features = ["proposed"] }
thiserror = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
anyhow = "1.0"
tracing = "0.1"
rand = "0.8"
md5 = "0.7"
sha2 = "0.10"
libp2p = { version = "0.53", features = ["tcp", "tls", "noise", "yamux", "gossipsub", "mdns", "tokio"] }
once_cell = "1.19"
blake3 = "1.5"
rayon = "1.8"
tempfile = "3.8"
num_cpus = "1.13"
