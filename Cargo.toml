[package]
name = "tariro-universal-meta-compiler"
version = "0.1.0"
edition = "2021"
authors = ["Samuel Mukandara", "Tariro AGI"]
description = "Core implementation of the Universal Meta-Compiler and POCO-REAF System"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }
num-complex = "0.4" # For Quantum states
