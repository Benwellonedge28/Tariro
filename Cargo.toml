[package]
name = "tariro"
version = "1.0.15"
edition = "2021"
authors = [
    "Samuel Mukandara <samuel@tariro.dev>",
    "Tariro AGI Contributors <contributors@tariro.dev>"
]
description = "Tariro AGI - The Most Powerful AGI System with Universal Meta-Compiler implementing POCO-REAF"
license = "BSL-1.01"
license_file = "LICENSE"
homepage = "https://tariro.dev"
repository = "https://github.com/Benwellonedge28/Tariro"
documentation = "https://docs.tariro.dev"
keywords = [
    "agi",
    "compiler",
    "meta-compiler",
    "universal",
    "artificial-general-intelligence",
    "cognitive",
    "quantum",
    "meta-learning",
    "self-modifying",
    "neural-symbolic"
]
categories = [
    "compilers",
    "artificial-intelligence",
    "science",
    "concurrency",
    "neural-networks",
    "quantum-computing"
]
readme = "README.md"
rust-version = "1.70"
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "LICENSE*",
    "README.md"
]
exclude = [
    "target/**/*",
    "**/*.md"
]

[package.metadata]
cargo-doc = { all-features = true }
license = { BSL = "https://www.tariro.dev/bcl" }
release = { enable = true }

[features]
default = ["std", "async-runtime", "logging"]
std = ["alloc"]
alloc = []
async-runtime = ["tokio/rt-multi-thread"]
logging = ["tracing", "tracing-subscriber"]
full = [
    "async-runtime",
    "logging",
    "metrics",
    "profiling",
    "telemetry"
]
metrics = ["dep:prometheus", "dep:metrics"]
profiling = ["dep:tracing-timing"]
telemetry = ["dep:opentelemetry", "dep:opentelemetry-jaeger"]

[dependencies]
# Core
uuid = { version = "1.8", features = ["v4", "fast-rng", "serde"] }
chrono = { version = "0.4", features = ["serde", "std"] }
serde = { version = "1.0", features = ["derive", "std"] }
serde_json = { version = "1.0", features = ["std"] }
serde_yaml = "0.9"

# Async Runtime
tokio = { version = "1.36", features = ["full"], optional = true }
async-trait = "0.1"
futures = { version = "0.3", features = ["std", "alloc"] }

# Cryptography & Security
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core", "std"] }
rand = { version = "0.8", features = ["std", "std_rng"] }
digest = "0.10"

# Numeric & Scientific
num-complex = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-derive = "0.4"
rayon = "1.8"
num_cpus = "1.20"

# Error Handling & Logging
thiserror = "1.0"
anyhow = { version = "1.0", features = ["std"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

# Serialization
toml = "0.8"
parse-display = "0.8"

# Metrics & Profiling
prometheus = { version = "0.13", optional = true }
metrics = { version = "0.21", optional = true }
tracing-timing = { version = "0.1", optional = true }

# Telemetry
opentelemetry = { version = "0.22", optional = true, features = ["trace"] }
opentelemetry-jaeger = { version = "0.22", optional = true }
opentelemetry-otlp = { version = "0.15", optional = true }
opentelemetry_sdk = { version = "0.22", optional = true }
tracing-opentelemetry = { version = "0.24", optional = true }

# Database (optional)
mongodb = { version = "3.1", optional = true }
bson = { version = "2.10", optional = true }

# Workspace member
tariro_sdk = { path = "tariro_sdk", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
quickcheck = "1.0"
tokio-test = "0.4"
mockall = "0.12"
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

[workspace]
resolver = "2"
members = ["tariro_sdk"]

[lib]
name = "tariro_agi_core"
path = "src/lib.rs"

[[bin]]
name = "tariro"
path = "src/main.rs"
required-features = ["full"]

[build-dependencies]
rustversion = "1.0"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.profile.dev]
inherits = "dev"

[profile.test]
inherits = "release"
opt-level = 2

[profile.bench]
inherits = "release"
debug = true

[badges]
maintenance = { status = "actively-developed" }
travis-ci = { repository = "Benwellonedge28/Tariro", branch = "main" }
coveralls = { repository = "Benwellonedge28/Tariro", service = "github" }
license = { SPDX = "BSL-1.01" }
