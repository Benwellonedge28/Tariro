[package]
name = "tariro"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1.0", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
num-complex = "0.4"
rand = "0.8"
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mongodb = "2.8"
parse-display = "0.8"
toml = "0.8"

# Workspace member
tariro_sdk = { path = "tariro_sdk" }

[workspace]
resolver = "2"
members = ["tariro_sdk"]

[lib]
name = "tariro_agi_core"
path = "src/lib.rs"
