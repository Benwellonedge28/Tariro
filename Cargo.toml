[package]
name = "tariro"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
log = "0.4"
env_logger = "0.10"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Local modules (if they were separate crates, for now they are part of this crate)
# sandboxed_environment = { path = "./src/modules/sandboxed_environment" }

[dev-dependencies]
