[package]
name = "tariro_ide_idpte"
version = "0.1.0"
edition = "2021"
authors = ["Samuel Mukandara <samuelmukandara@gmail.com>"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
warp = "0.3"
async-trait = "0.1.50"
thiserror = "1.0"
env_logger = "0.9.0"
log = "0.4.14"
http-body-util = "0.1.0"
hyper = { version = "1.0.0", features = ["full"] }
hyper-util = { version = "0.1.0", features = ["full"] }
bytes = "1.0"
url = "2.2.2"
reqwest = { version = "0.11", features = ["json", "multipart"], default-features = false }
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-recursion = "0.3.2"
paho-mqtt = { version = "0.11", features = ["bundled"], optional = true }
sqlx = { version = "0.7", features = ["runtime-tokio", "macros", "postgres", "uuid", "chrono", "json"], default-features = false }
rand = "0.8.5"
md5 = "0.7.0"
