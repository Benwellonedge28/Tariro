[package]
name = "tariro"
version = "1.0.12"
edition = "2021"
authors = ["Samuel Mukandara <samuel@tariro.dev>"]
description = "Tariro AGI - The Universal Meta-Compiler System implementing POCO-REAF"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Benwellonedge28/Tariro"
repository = "https://github.com/Benwellonedge28/Tariro"
documentation = "https://docs.tariro.dev"
keywords = ["agi", "compiler", "meta-compiler", "universal", "ai", "quantum", "meta-learning"]
categories = ["compilers", "artificial-intelligence", "science", "concurrency"]
readme = "README.md"
rust-version = "1.70"

[package.metadata]
cargo-doc = { all-features = true }
license = { MIT = "https://opensource.org/licenses/MIT", Apache-2.0 = "https://www.apache.org/licenses/LICENSE-2.0" }

[features]
default = ["std", "async-runtime"]
std = []
async-runtime = ["tokio/rt-multi-thread"]
full = ["async-runtime", "mongodb", "metrics", "profiling"]
metrics = ["dep:prometheus"]
profiling = ["dep:tracing-timing"]

[dependencies]
# Core
uuid = { version = "1.0", features = ["v4", "fast-rng", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async Runtime
tokio = { version = "1.0", features = ["full"], optional = true }
async-trait = "0.1"
futures = "0.3"

# Cryptography & Security
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand = "0.8"

# Numeric & Scientific
num-complex = "0.4"
num-traits = "0.2"
num-derive = "0.4"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
mongodb = { version = "2.8", optional = true }
bson = { version = "2.15", optional = true }

# Serialization
toml = "0.8"
parse-display = "0.8"

# Metrics & Profiling
prometheus = { version = "0.13", optional = true }
tracing-timing = { version = "0.1", optional = true }

# Workspace member
tariro_sdk = { path = "tariro_sdk" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"
quickcheck = "1.0"
tokio-test = "0.4"
mockall = "0.12"

[workspace]
resolver = "2"
members = ["tariro_sdk"]

[lib]
name = "tariro_agi_core"
path = "src/lib.rs"

[[bin]]
name = "tariro"
path = "src/main.rs"
required-features = ["full"]

[[bench]]
name = "benchmark"
harness = false

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
inherits = "release"
opt-level = 2
