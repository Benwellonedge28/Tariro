name: Benchmarks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-benchmark-target
      - name: Run benchmarks
        run: cargo bench || echo "No benchmarks found or benchmarks failed"
      - name: Check benchmark compilation
        run: |
          if cargo bench --no-run 2>&1 | grep -q "Compiling"; then
            echo "Benchmarks compiled successfully."
          fi

  performance-tracker:
    name: Performance Tracking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite with timing
        run: |
          echo "Running performance tests..."
          cargo test --release -- --nocapture 2>&1 | tee test_output.txt
      - name: Check binary size
        run: |
          cargo build --release 2>&1 || true
          if [ -f target/release/tariro ]; then
            ls -lh target/release/tariro
            du -sh target/release/tariro
          fi
      - name: Check compile time
        run: |
          cargo clean 2>&1 || true
          echo "Testing compile time..."
          timeout 300 cargo build --release 2>&1 | tail -20 || echo "Build took longer than 5 minutes"
