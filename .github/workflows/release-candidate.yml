name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Candidate Version (e.g., 1.1.0-rc.1)'
        required: true
        type: string
      base_branch:
        description: 'Base Branch'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # Pre-flight Checks
  # ============================================
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      is_valid: ${{ steps.version.outputs.IS_VALID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate version format
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Creating release candidate: $VERSION"

          # Validate version format (semver with -rc suffix)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "IS_VALID=false" >> $GITHUB_OUTPUT
            echo "Error: Version must be in format X.Y.Z-rc.N (e.g., 1.1.0-rc.1)"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_VALID=true" >> $GITHUB_OUTPUT

      - name: Check existing tags
        run: |
          if git tag | grep -q "^v${{ steps.version.outputs.VERSION }}$"; then
            echo "Error: Tag v${{ steps.version.outputs.VERSION }} already exists"
            exit 1
          fi

      - name: Check CHANGELOG
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "Warning: CHANGELOG.md not found"
          else
            echo "CHANGELOG.md exists"
          fi

  # ============================================
  # Full Test Suite
  # ============================================
  test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Run full test suite
        uses: mozilla-actions/sccache-action@v0.0.6
        with:
          config-cache: '{"cache": true}'

      - name: Run tests
        run: |
          cargo test --all-features -- --nocapture 2>&1 | tee test_output.txt

      - name: Run doc tests
        run: cargo test --doc

      - name: Check test results
        run: |
          if grep -q "test result: FAILED" test_output.txt; then
            echo "Tests failed"
            exit 1
          fi
          echo "All tests passed"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc-test-results-${{ needs.preflight.outputs.version }}
          path: test_output.txt
          retention-days: 7

  # ============================================
  # Security Audit
  # ============================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cargo-deny
        uses: baptiste0928/cargo-deny-action@v1
        with:
          command: check advisories bans licenses

  # ============================================
  # Create Release Branch
  # ============================================
  prepare-branch:
    name: Prepare Release Branch
    runs-on: ubuntu-latest
    needs: [ preflight, test-suite, security-audit ]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Create release branch
        run: |
          RELEASE_BRANCH="release/${{ needs.preflight.outputs.version }}"
          git checkout -b "$RELEASE_BRANCH"

      - name: Update version in Cargo.toml
        run: |
          # Update version in Cargo.toml
          sed -i 's/^version = "[^"]*"/version = "${{ needs.preflight.outputs.version }}"/' Cargo.toml
          cat Cargo.toml | grep "^version"

      - name: Update tariro_sdk version
        if: exists('tariro_sdk/Cargo.toml')
        run: |
          if [ -f tariro_sdk/Cargo.toml ]; then
            sed -i 's/^version = "[^"]*"/version = "${{ needs.preflight.outputs.version }}"/' tariro_sdk/Cargo.toml
          fi

      - name: Commit version changes
        run: |
          git add Cargo.toml tariro_sdk/Cargo.toml 2>/dev/null || true
          git commit -m "chore: Bump version to ${{ needs.preflight.outputs.version }}

          Release candidate version for testing.

          Co-authored-by: GitHub Actions <actions@github.com>"

      - name: Push release branch
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/${{ needs.preflight.outputs.version }}

  # ============================================
  # Build RC Binaries
  # ============================================
  build-rc:
    name: Build RC Binaries
    runs-on: ubuntu-latest
    needs: prepare-branch
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x86_64
          - macos-x86_64
          - macos-arm64
          - windows-x86_64
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: release/${{ needs.prepare-branch.outputs.version }}
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Build release binary
        uses: mozilla-actions/sccache-action@v0.0.6
        with:
          config-cache: '{"cache": true}'

      - name: Build
        run: cargo build --release --features full

      - name: Prepare artifact
        run: |
          mkdir -p dist
          if [[ "${{ matrix.platform }}" == "windows-x86_64" ]]; then
            cp target/release/tariro.exe dist/tariro-${{ matrix.platform }}.exe
          else
            cp target/release/tariro dist/tariro-${{ matrix.platform }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rc-binaries-${{ matrix.platform }}-${{ needs.prepare-branch.outputs.version }}
          path: dist/*
          retention-days: 14

  # ============================================
  # Build RC Container
  # ============================================
  build-container:
    name: Build RC Container
    runs-on: ubuntu-latest
    needs: prepare-branch
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: release/${{ needs.prepare-branch.outputs.version }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=rc,enable=true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.prepare-branch.outputs.version }}
            ghcr.io/${{ github.repository }}:rc-latest
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================
  # Create GitHub Pre-release
  # ============================================
  create-prerelease:
    name: Create Pre-release
    runs-on: ubuntu-latest
    needs: [ prepare-branch, build-rc, build-container ]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: release/${{ needs.prepare-branch.outputs.version }}
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: List release files
        run: |
          echo "Release files:"
          find release -type f | head -20

      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-branch.outputs.version }}
          name: Tariro AGI v${{ needs.prepare-branch.outputs.version }} (Release Candidate)
          body: |
            ## Release Candidate

            This is a pre-release version for testing.

            ### What's New
            See the CHANGELOG for details.

            ### Testing
            Please test this release candidate thoroughly before the final release.

            ### Known Issues
            - None reported

            ### Installation
            See the [README](https://github.com/Benwellonedge28/Tariro/blob/main/README.md) for installation instructions.

          draft: true
          prerelease: true
          files: release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Notify RC Availability
  # ============================================
  notify:
    name: Notify RC Availability
    runs-on: ubuntu-latest
    needs: [ prepare-branch, create-prerelease ]
    timeout-minutes: 10
    steps:
      - name: Summary
        run: |
          echo "## Release Candidate Created"
          echo ""
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Version | ${{ needs.prepare-branch.outputs.version }} |"
          echo "| Branch | release/${{ needs.prepare-branch.outputs.version }} |"
          echo "| Pre-release | https://github.com/${{ github.repository }}/releases |"
          echo ""
          echo "### Next Steps"
          echo "1. Test the release candidate thoroughly"
          echo "2. Review and merge any remaining PRs"
          echo "3. When ready, create the final release using the 'cd' workflow"
