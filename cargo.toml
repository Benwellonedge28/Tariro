[workspace]
resolver = "2"
members = [
    "tariro_sdk",
    ".",
]

[package]
name = "tariro-agi-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Web framework
axum = "0.7"
warp = "0.3"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async traits
async-trait = "0.1"

# Time and IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Random
rand = "0.8"

# Database
mongodb = "2.8"

# Parsing
parse-display = "0.8"

# Error handling
thiserror = "1"
anyhow = "1"

# Futures
futures = "0.3"

# Local SDK
tariro_sdk = { path = "tariro_sdk" }

[dev-dependencies]
tokio-test = "0.4"