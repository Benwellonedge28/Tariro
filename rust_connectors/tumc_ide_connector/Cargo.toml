[package]
name = "tumc_ide_connector"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false } # For making async requests to IDE
dotenv = "0.15"
log = "0.4"
env_logger = "0.9"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0" # For custom error types
tokio = { version = "1", features = ["full"] } # For async runtime
hmac = "0.12" # For HMAC signature verification (future use)
sha2 = "0.10" # For HMAC signature verification (future use)

[dev-dependencies] # New section for testing dependencies
wiremock = "0.5"
actix-web = { version = "4", features = ["macros"] } # Use for Actix-web testing utilities
