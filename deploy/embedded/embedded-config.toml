# Tariro AGI Embedded Configuration
# Optimized for microcontrollers and resource-constrained devices

# ============================================
# Embedded Configuration for Microcontrollers
# ============================================

[embedded]
# Embedded-specific settings
target = "cortex-m4"
flash_size = "2MB"
ram_size = "256KB"

[embedded.board]
# Board-specific configuration
name = "generic-arm"
mcu = "STM32F4xx"
clock_speed = "168MHz"

[server]
# Minimal server for embedded
host = "0.0.0.0"
port = 8080
workers = 1
max_connections = 10

[server.limits]
# Stricter limits for embedded
max_request_size = "64KB"
request_timeout = "10s"
keepalive_timeout = "30s"

[logging]
# Minimal logging
level = "warn"
format = "compact"
output = "uart"  # Serial output for debugging

[distributed]
# Disabled or minimal for embedded
enabled = false

[storage]
# Minimal storage
backend = "embedded"
path = "/flash/data.bin"
cache_size = "16KB"

[features]
# Disabled features for embedded
ai_processing = true
caching = true
compression = false
encryption = true
logging = false

[memory]
# Memory management
arena_size = "64KB"
stack_size = "8KB"
heap_size = "128KB"

[peripherals]
# Peripheral configuration
uart_baud = 115200
spi_mode = "mode0"
i2c_speed = "400kHz"

# ============================================
# IoT Gateway Configuration
# ============================================

[iot]
# IoT gateway settings
enabled = true
protocol = "mqtt"
broker = "mqtt://localhost:1883"
client_id = "tariro-gateway-${DEVICE_ID}"
qos = 1

[iot.topics]
# MQTT topics
commands = "tariro/commands"
telemetry = "tariro/telemetry"
status = "tariro/status"

[iot.reconnect]
# Reconnection settings
enabled = true
interval = "5s"
max_attempts = 10

# ============================================
# Edge Computing Configuration
# ============================================

[edge]
# Edge computing settings
enabled = true
mode = "lightweight"  # lightweight, standard, full

[edge.computation]
# Distributed computation
offload_enabled = true
max_offload_size = "1MB"
compression = true

[edge.cache]
# Local caching
enabled = true
max_size = "50MB"
ttl = "1h"

# ============================================
# Planetary-Scale Distributed Settings
# ============================================

[planetary]
# Multi-planetary configuration
enabled = true
network_type = "mesh"  # mesh, star, tree

[planetary.regions]
# Regional configuration
primary = "earth"
secondary = "mars"
tertiary = "moon"

[planetary.sync]
# Cross-planetary synchronization
enabled = true
interval = "60s"
compression = true
encryption = true
max_latency_tolerance = "500ms"

[planetary.fallback]
# Offline mode
enabled = true
queue_size = 10000
persistence = true
